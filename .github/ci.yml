name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore

      - name: Build API
        run: dotnet build --no-restore

      - name: Restore Tests
        run: dotnet restore ../PoolManager.Tests/PoolManager.Tests.csproj

      - name: Run Tests
        run: dotnet test ../PoolManager.Tests/PoolManager.Tests.csproj --no-restore