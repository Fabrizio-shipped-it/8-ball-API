name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PoolManager.slnx

      - name: Build
        run: dotnet build PoolManager.slnx --no-restore

      - name: Test
        run: dotnet test PoolManager.slnx --no-restore

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: poolmanager-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Express Mode fija el digest de la imagen al crear el servicio, así que
      # `update-service --force-new-deployment` relanza SIEMPRE el mismo binario
      # y el deploy no cambia nada. Hay que pasarle explícitamente la imagen nueva
      # con la API de Express Mode.
      #
      # Se manda la tag del SHA, no 'latest': cada deploy queda apuntando a una
      # imagen inmutable distinta, que es lo que hace que Express detecte el cambio.
      - name: Deploy new image to ECS Express
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: poolmanager-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          SERVICE_ARN="arn:aws:ecs:us-east-1:${ACCOUNT_ID}:service/default/poolmanager-api"
          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Se parte de la config actual del contenedor y se le cambia SOLO la
          # imagen. Si se mandara un primaryContainer armado a mano se perderían
          # las variables de entorno (connection string, Keycloak, S3).
          aws ecs describe-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --query 'service.activeConfigurations[0].primaryContainer' \
            --output json > container.json

          jq --arg img "$NEW_IMAGE" '.image = $img' container.json > container-new.json

          echo "Imagen nueva: $NEW_IMAGE"
          jq '.environment |= map(if (.name | test("Connection|Secret")) then .value = "***" else . end)' container-new.json

          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --primary-container file://container-new.json