name: 8-ball-containers

services:
  postgres:
    image: postgres:16-alpine
    container_name: poolmanager-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: poolmanager-keycloak
    command: start-dev
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: poolmanager-minio
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poolmanager-api
    env_file: .env
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Keycloak__Authority: "http://keycloak:8080/realms/poolmanager"
      S3__ServiceUrl: "http://minio:9000"
      S3__AccessKey: "${MINIO_ROOT_USER}"
      S3__SecretKey: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "5225:8080"
    # Con `depends_on` a secas Docker solo espera a que el contenedor arranque,
    # no a que el servicio esté listo. La API llegaba a Postgres antes de que
    # aceptara conexiones y fallaba la primera query.
    #
    # Keycloak queda sin condition a propósito: tarda ~40s en estar listo y la
    # API no lo necesita para arrancar (solo al validar el primer token).
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  pgdata:
  miniodata:
