name: 8-ball-containers

services:
  postgres:
    image: postgres:16-alpine
    container_name: poolmanager-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: poolmanager-keycloak
    command: start-dev
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio
    container_name: poolmanager-minio
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: poolmanager-api
      env_file: .env
      environment:
        ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
        Keycloak__Authority: "http://keycloak:8080/realms/poolmanager"
        S3__ServiceUrl: "http://minio:9000"
        S3__AccessKey: "${MINIO_ROOT_USER}"
        S3__SecretKey: "${MINIO_ROOT_PASSWORD}"
      ports:
        - "5225:8080"
      depends_on:
        - postgres
        - keycloak
        - minio

volumes:
  pgdata:
  miniodata: